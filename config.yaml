schedule:
  start: '22:00'
  stop: '06:00'
  weekly_reset: 'Sun 23:00'

models:
  claude: 'claude'
  ollama: 'mistral'
  aider:  'ollama/qwen2.5-coder:3b'

thresholds:
  cpu_alert: 80
  ram_alert: 85
  disk_alert: 90

github:
  repos:
    - dsantacruza101/my_Portfolio_React_v2
    - dsantacruza101/portfolioServiceLauncher
    - dsantacruza101/dsantacruz-client-gateway
    - dsantacruza101/NodeMailer_MicroService
    - dsantacruza101/dark-Knight
  issue_label: night-agent
  # Rama de integracion por defecto. Un repo puede fijar la suya con
  # `work_branch` en su entrada de `repos` del perfil de especialista
  # (my_Portfolio_React_v2 -> development, en batgirl.yaml). Nunca main/master.
  work_branch: dev

# Mapeo repo remoto -> ruta local de produccion. SOLO se usa para leer el
# CLAUDE.md de contexto (modo Desarrollo y Post-Reset); nunca para checkout,
# pull ni commits: todo ese trabajo ocurre en development.workspace_dir.
repo_paths:
  dark-Knight: ~/projects/night-agent
  NodeMailer_MicroService: ~/projects/portfolioServiceLauncher/nodeMailer-ms
  dsantacruz-client-gateway: ~/projects/portfolioServiceLauncher/client-gateway
  my_Portfolio_React_v2: ~/projects/my_Portfolio_React_v2
  portfolioServiceLauncher: ~/projects/portfolioServiceLauncher

development:
  workspace_dir: ~/projects/.nightwing-workspace
  aider_timeout: 2700
  aider_attempts: 3
  max_claude_escalations: 2   # escalaciones qwen -> Claude por noche
  claude_timeout: 1800        # segundos por escalacion (acotado por el limite de 3h por issue)
  # Familias npm que se mueven juntas en los parches deterministas del radar:
  # si el paquete parchado cae en una familia, cada miembro presente en
  # package.json sube a la misma version objetivo (o, si no existe para ese
  # miembro, a su maxima del mismo major >= la actual). Patrones fnmatch;
  # `exclude` gana sobre `include`.
  package_families:
    nestjs:
      # @nestjs/config, cli, schematics, mapped-types, throttler... versionan aparte.
      include: ['@nestjs/common', '@nestjs/core', '@nestjs/microservices', '@nestjs/platform-*', '@nestjs/testing', '@nestjs/websockets']
    angular:
      include: ['@angular/*']
      exclude: ['@angular/cli', '@angular-devkit/*']
    react:
      include: [react, react-dom]
    vitest:
      include: [vitest, '@vitest/*']
    tailwind:
      include: [tailwindcss, '@tailwindcss/*']
    prisma:
      include: [prisma, '@prisma/client']
    typescript-eslint:
      include: [typescript-eslint, '@typescript-eslint/*']

# Equipo de desarrollo: perfiles en specialists.dir (esquema en su README.md).
# Hoy: nightwing (label backend, default), batgirl (label frontend),
# red_robin (label data, datos + IA), robin (label mobile, Flutter/Dart;
# test_runner flutter) y spoiler (label devops: portfolioServiceLauncher en dev
# + solo `.github/workflows/**` de los repos de los demas, via `paths`).
# red_robin y robin aun sin repos asignados.
# Un issue va al especialista cuyo label tenga; sin label de especialidad, al default.
specialists:
  dir: batcave/specialists
  knowledge_dir: batcave/knowledge   # notas por especialista: <knowledge_dir>/<nombre>/*.md
  default: nightwing

# Radar tecnologico (batcave/radar.py): inventario de dependencias, OSV y
# ultimas versiones por especialista. Workspace de solo lectura, nunca produccion.
# Timers: radar-nightwing (07:00, lunes 01:00), radar-batgirl (07:10, lunes 01:20),
# radar-red-robin (07:20, lunes 01:40), radar-robin (07:30, lunes 02:00) y
# radar-spoiler (07:40, lunes 02:20).
# Un perfil sin repos termina sin hacer nada. Ecosistemas: npm, PyPI, Maven y Pub
# (pubspec.yaml/pubspec.lock; Pub sin parche determinista -> needs-human) por
# defecto; `radar_ecosystems` del perfil los cambia (Spoiler: GitHub Actions,
# via OSV + API de GitHub, needs-human; y Docker, imagenes base oficiales via
# Docker Hub, solo reporte).
radar:
  workspace_dir: ~/projects/.radar-workspace
  github_owner: dsantacruza101     # owner para repos de un perfil que no esten en github.repos
  http_timeout: 15                 # segundos por llamada HTTP (OSV, npm, PyPI, Maven, pub.dev, GitHub, Docker Hub)
  alert_severities: [CRITICAL, HIGH]   # Telegram inmediato solo para estas, en dependencias de produccion
  max_weekly_summaries: 5          # notas de Claude por semana (protege el presupuesto semanal)
  claude_timeout: 600              # segundos por nota en modo --weekly

knowledge_base:
  path: ~/projects/night-agent/knowledge
  max_examples: 1000
  min_quality_score: 0.8

red_hood:
  coverage_threshold: 60
  max_tests_per_repo: 3
  workspace_dir: ~/projects/.red-hood-workspace
  local_repos:
    - ~/projects/my_Portfolio_React_v2
    - ~/projects/portfolioServiceLauncher/client-gateway
    - ~/projects/portfolioServiceLauncher/nodeMailer-ms
    - ~/projects/telegram-bot
    - ~/projects/night-agent

batwoman:
  poll_interval: 60
  digest_hour: 8            # America/El_Salvador
  container: single-node-wazuh.manager-1
  alerts_path: /var/ossec/logs/alerts/alerts.json
  min_level: 7              # bajo esto se ignora
  evaluate_level: 10        # desde aqui se evalua con TypeSafe
  notify_level: 12          # fallback sin TypeSafe: notify_now desde este nivel
  alert_cooldown_hours: 6
  integrity_timeout: 600    # segundos para sudo -n dpkg --verify (corre con el digest)
  critical_paths:
    - /etc/sudoers.d
    - /etc/ssh
    - /home/dsantacruz/.ssh/authorized_keys
    - /etc/night-agent.env
    - /etc/webhook.env
    - /etc/telegram-bot.env
    - /etc/cloudflared
    - /etc/systemd/system
    - /home/dsantacruz/.claude/settings.json
  # Conexiones salientes (batcave/egress.py). Linea base por
  # (proceso o container, ASN destino, puerto destino, protocolo), nunca por IP.
  egress:
    enabled: true
    interval: 60                # segundos entre ciclos (procesa los flujos del stream; snapshot solo de respaldo)
    stream: true                # lector de `conntrack -E -e NEW` en segundo plano (TCP + UDP)
    ss_refresh: 0
    attribution_delay: 0.5      # segundos tras un flujo nuevo antes de buscar su proceso en `ss`
    ss_min_interval: 1          # segundos minimos entre refrescos de `ss` bajo demanda
    learning_days: 7            # desde el primer ciclo: solo aprende, nunca alerta
    safe_ports: [80, 443, 53, 853, 22, 7844]   # fallback sin TypeSafe: fuera de estos -> notify_now
    asn_cache_days: 7           # TTL de batcave/memory/egress_asn_cache.json (Team Cymru + rDNS)
    docker_refresh: 600         # segundos entre `docker network inspect` (IP -> container)
    dns_timeout: 3              # segundos por consulta DNS
    command_timeout: 20         # segundos por ss / conntrack / docker
    max_lookups_per_cycle: 50   # IPs nuevas resueltas por ciclo (el resto en el siguiente)
    max_evaluations_per_cycle: 10   # destinos nuevos evaluados por ciclo (el resto en el siguiente)
