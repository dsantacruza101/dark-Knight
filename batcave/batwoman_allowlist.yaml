# Allowlist de Batwoman: actividad conocida de la Batifamilia que NO debe
# generar alertas ni contar en el digest diario.
#
# Cada entrada de `ignore` puede tener:
#   rule_id:   id de la regla de Wazuh (string)
#   full_log:  regex (re.search) contra el campo full_log de la alerta
#   path:      regex (re.search) contra syscheck.path
#   reason:    por que se ignora (obligatorio, para auditar el allowlist)
# Una entrada aplica solo si TODOS sus campos presentes coinciden.
#
# Reglas fijas (no se pueden saltar desde aqui):
# - Los cambios FIM bajo /home/dsantacruz/projects/night-agent (p. ej. por
#   git pull) NO se ignoran: los cambios de codigo de los agentes deben
#   quedar visibles. No agregar entradas de `path` para ese directorio.
# - Las alertas sobre batwoman.critical_paths (config.yaml) se escalan
#   SIEMPRE, aunque coincidan con una entrada de este archivo.
#
# Se relee en cada poll: editarlo no requiere reiniciar batwoman.service.

ignore:
  # Comandos permitidos en /etc/sudoers.d/batifamilia: Lucius Fox repara
  # servicios con systemctl y Batman (modo Monitoreo) consulta fail2ban.
  - rule_id: "5402"
    full_log: 'COMMAND=(/usr)?/bin/systemctl (restart|start|enable --now) (telegram-bot|cloudflared|night-agent\.timer|red-hood\.timer|ace\.timer|lucius-fox\.timer|webhook-portfolio|signal\.service|ollama|wazuh-agent|batwoman\.service)(\.service)?\s*$'
    reason: "Lucius Fox reparando un servicio conocido de la Batifamilia"
  - rule_id: "5402"
    full_log: 'COMMAND=(/usr)?/bin/fail2ban-client status( [A-Za-z0-9_-]+)?\s*$'
    reason: "Batman (modo Monitoreo) consultando el estado de fail2ban"
  - rule_id: "5402"
    full_log: 'COMMAND=(/usr)?/bin/dpkg --verify\s*$'
    reason: "Batwoman verificando la integridad de paquetes junto con el digest diario"
  - rule_id: "5402"
    full_log: 'COMMAND=(/usr)?/s?bin/(ss -tnpH state established|conntrack -L -p tcp -o extended)\s*$'
    reason: "Batwoman tomando el snapshot de conexiones salientes (egress)"

# Allowlist de integridad (dpkg --verify, chequeo diario junto al digest).
# Rutas ABSOLUTAS EXACTAS (comparacion por igualdad, sin regex ni prefijos)
# cuyo checksum alterado es esperado: se excluyen de los hallazgos criticos
# pero se cuentan aparte como "esperados" en el digest.
# Nunca se allowlistea por nombre de paquete: cada archivo se justifica solo.
integrity_paths:
  # Editado por nosotros: configuracion del agente de Wazuh (manager, FIM).
  - /var/ossec/etc/ossec.conf
  # Generado al registrar el agente contra el manager (id + llave).
  - /var/ossec/etc/client.keys
  # Se ajusta a la zona horaria del sistema durante la instalacion.
  - /var/ossec/etc/localtime

# Allowlist de egress (conexiones salientes, batcave/egress.py).
# `org` se compara como substring (sin distinguir mayusculas) contra el
# nombre de organizacion del ASN destino que devuelve Team Cymru
# (p. ej. "CLOUDFLARENET - Cloudflare, Inc., US"). Un destino nuevo de una de
# estas organizaciones entra directo a la linea base, sin evaluacion ni
# alerta. Se relee en cada ciclo de egress.
egress_orgs:
  - org: "Cloudflare"
    reason: "Cloudflare Tunnel (cloudflared, puerto 7844) y CDN de muchos registros"
  - org: "GitHub"
    reason: "git fetch/push, API de issues, release notes del radar"
  - org: "Telegram"
    reason: "Alfred y las notificaciones de la Batifamilia"
  - org: "Anthropic"
    reason: "Claude Code (escalaciones, post-reset, radar semanal)"
  - org: "Fastly"
    reason: "CDN de PyPI y del registry de npm"
  - org: "Canonical"
    reason: "Repositorios apt y servicios de Ubuntu"
  - org: "Docker"
    reason: "Docker Hub (pull de imagenes)"
