# Nightwing (Dick Grayson) — especialista backend del modo Desarrollo.
# Esquema documentado en batcave/specialists/README.md.

name: nightwing
display_name: Nightwing
emoji: "🐦"
role: backend
label: backend
# Recibe los issues que solo tienen `night-agent` (sin label de especialidad).
default: true

languages: [TypeScript, JavaScript, Python, Java]
frameworks: [NestJS, Node.js+Express, FastAPI, Spring Boot]
orms: [TypeORM, Prisma]
messaging: [NATS]

# Nombres de repo en GitHub (sin el owner).
repos:
  - dsantacruz-client-gateway
  - NodeMailer_MicroService
  - telegram-bot
  - dark-Knight
  - name: bills
    work_branch: dev

conventions:
  - "Conventional commits (feat/fix/chore/ci/test/refactor)."
  - "TypeScript estricto: nunca `any`; tipa parametros, retornos y DTOs."
  - "NestJS: un modulo por feature; DTOs con decoradores de class-validator."
  - "Nunca tocar .env, docker-compose ni archivos de infraestructura (nginx, fail2ban, cloudflared, ssh, systemd)."

# Verificacion por stack. Se corren todos los stacks cuyo `detect` coincida
# con algun archivo en la raiz del repo, en el orden listado.
verification:
  node:
    detect: [package.json]
    steps:
      - builtin: npm_ci_if_needed
      - cmd: npm run build
        when: script:build
      # Solo si `lint` ya existia en origin/<rama de trabajo>: un script
      # que el modelo agrego en el intento no es requisito.
      - cmd: npm run lint
        when: base_script:lint
      # Runner de la suite segun `detect_suite_runner` (igual que el runner por
      # archivo): `--watchAll` es solo de jest; vitest lo rechaza con
      # `Unknown option` y no corre ningun test.
      - cmd: CI=true npx --no-install vitest run --passWithNoTests
        when: [script:test, "runner:vitest"]
        counts_tests: node
      - cmd: CI=true npm test -- --passWithNoTests --watchAll=false
        when: [script:test, "runner:jest"]
        counts_tests: node
  python:
    detect: [requirements.txt, pyproject.toml, setup.py]
    steps:
      - builtin: py_compile_changed
      # Sin uv.lock el comando se reescribe a `.verify-venv/bin/python -m
      # pytest -q`: venv aislado y cacheado en el workspace con los
      # requirements del repo + pytest (nunca el python3 del PATH).
      - cmd: python3 -m pytest -q
        when: exists:tests
  spring:
    detect: [mvnw, pom.xml]
    steps:
      - cmd: ./mvnw -q test
        when: exists:mvnw
        timeout: 1200
