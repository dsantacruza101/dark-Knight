# Red Robin (Tim Drake) — especialista de datos e IA del modo Desarrollo.
# Esquema documentado en batcave/specialists/README.md.

name: red_robin
display_name: Red Robin
emoji: "🔴"
role: data
label: data

languages: [Python, SQL]
databases: [PostgreSQL (+pgvector), MongoDB, Firebase]
orms: [Prisma, TypeORM, Alembic]
ai: [RAG, embeddings, Ollama]

# Nombres de repo en GitHub (sin el owner); ruta local en config.yaml repo_paths.
repos:
  # ~/projects/penguin: Python 3.12 + uv (uv.lock), SQLAlchemy + Alembic
  # (alembic/versions), PostgreSQL + pgvector; ruff, mypy --strict, pytest.
  - name: investing-bot-penguin
    work_branch: dev
  # ~/projects/tarjetas: Node + TypeScript (Express 5, tsup, vitest), `pg`
  # con SQL crudo (CREATE TABLE IF NOT EXISTS en ensureSchema); sin
  # herramienta de migraciones.
  - name: tarjetas
    work_branch: dev

# Runner por archivo de test: auto|vitest|jest|pytest (los .py siempre pytest).
test_runner: auto

conventions:
  - "Conventional commits (feat/fix/chore/ci/test/refactor)."
  - "Migraciones siempre reversibles (up + down / upgrade + downgrade)."
  - "Nunca cambiar esquema ni datos sin una migracion versionada."
  - "Solo queries parametrizadas: nunca interpolar valores en SQL (ni f-strings ni concatenacion)."
  - "Sin secretos en el codigo: credenciales y URLs de conexion por variables de entorno."
  - "Toda query nueva revisa sus indices (EXPLAIN) antes de comitear."
  - "Nunca tocar .env, docker-compose ni archivos de infraestructura (nginx, fail2ban, cloudflared, ssh, systemd)."

# Verificacion por stack. Se corren todos los stacks cuyo `detect` coincida
# con algun archivo en la raiz del repo, en el orden listado.
verification:
  # Proyectos uv (investing-bot-penguin): mismos pasos que su CI, en el venv
  # bloqueado del workspace (`uv sync --locked`). PENGUIN_ENV_FILE apunta a un
  # archivo inexistente para que nunca se lea un .env real; sin
  # PENGUIN_TEST_DATABASE_URL los tests usan SQLite en memoria. `alembic
  # check` no se corre: necesita un Postgres (lo hace el CI del repo).
  uv:
    detect: [uv.lock]
    steps:
      - builtin: py_compile_changed
      - cmd: uv sync --locked
        requires: uv
        timeout: 900
      - cmd: uv run --locked ruff check .
        requires: uv
      - cmd: uv run --locked ruff format --check .
        requires: uv
      - cmd: uv run --locked mypy
        requires: uv
        timeout: 900
      - cmd: PENGUIN_ENV_FILE=/nonexistent/penguin.env uv run --locked pytest -q
        requires: uv
        when: exists:tests
        timeout: 1200
        counts_tests: pytest
  # Python sin uv (requirements.txt / setup.py). pyproject.toml no esta en
  # `detect` a proposito: en un repo uv, `python3 -m pytest` del sistema no
  # tiene las dependencias.
  python:
    detect: [requirements.txt, setup.py]
    steps:
      - builtin: py_compile_changed
      - cmd: python3 -m pytest -q
        when: exists:tests
  node:
    detect: [package.json]
    steps:
      - builtin: npm_ci_if_needed
      - cmd: npm run build
        when: script:build
      - cmd: npm run typecheck
        when: script:typecheck
      - cmd: npm run lint --if-present
      # Los repos Node de Red Robin usan vitest (no acepta --watchAll de jest).
      # tests/cardRepository.test.ts (tarjetas) exige
      # TARJETAS_TEST_DATABASE_URL (Postgres real), que el workspace no tiene:
      # se excluye de la suite completa.
      - cmd: CI=true npx vitest run --passWithNoTests --exclude tests/cardRepository.test.ts
        when: script:test
        counts_tests: node
