# Batgirl (Cassandra Cain) — especialista frontend del modo Desarrollo.
# Esquema documentado en batcave/specialists/README.md.

name: batgirl
display_name: Batgirl
emoji: "🦇"
role: frontend
label: frontend

languages: [TypeScript, JavaScript, HTML, CSS/SCSS]
frameworks: [Angular, React, Next.js, Vue, Nuxt, Astro]
ui: [PrimeNG, PrimeFlex, Tailwind, Bootstrap]
testing: [Vitest, Jest, Angular TestBed, Testing Library]

# Nombres de repo en GitHub (sin el owner). `work_branch` es la rama de
# integracion del repo (default `github.work_branch`, `dev`).
repos:
  # React 19 + Vite + TypeScript + Tailwind v4; Vitest (104 tests).
  - name: my_Portfolio_React_v2
    work_branch: development

# Runner por archivo de test: auto|vitest|jest|pytest (los .py siempre pytest).
test_runner: vitest

conventions:
  - "Conventional commits (feat/fix/chore/ci/test/refactor)."
  - "TypeScript estricto: nunca `any`; tipa props, estado, eventos y retornos."
  - "Componentes accesibles: HTML semantico, atributos aria cuando hagan falta y navegacion completa por teclado (foco visible)."
  - "Responsive first: mobile primero, breakpoints hacia arriba."
  - "Sin estilos inline cuando el repo tiene Tailwind o PrimeFlex: usa sus clases utilitarias."
  - "Componentes pequenos y testeables; logica en hooks/servicios puros."
  - "Tests con Testing Library: consulta por rol/texto accesible, no por clases CSS."
  - "Nunca tocar .env, docker-compose ni archivos de infraestructura (nginx, fail2ban, cloudflared, ssh, systemd)."

# Verificacion por stack. Se corren todos los stacks cuyo `detect` coincida
# con algun archivo en la raiz del repo, en el orden listado.
verification:
  node:
    detect: [package.json]
    steps:
      - builtin: npm_ci_if_needed
      - cmd: npm run build
        when: script:build
      # Solo si `lint` ya existia en origin/<rama de trabajo>: un script
      # que el modelo agrego en el intento no es requisito.
      - cmd: npm run lint
        when: base_script:lint
      # Runner de la suite segun `detect_suite_runner` (igual que el runner por
      # archivo): `--watchAll` es solo de jest; vitest lo rechaza con
      # `Unknown option` y no corre ningun test.
      # Con vitest, `npm test` es `vitest` (modo watch): se llama a `vitest
      # run` directo. Con `test_runner: vitest` el paso jest no aplica; queda
      # para cuando el perfil pase a `auto` con un repo jest (Angular).
      - cmd: CI=true npx --no-install vitest run --passWithNoTests
        when: "runner:vitest"
        counts_tests: node
      - cmd: CI=true npm test -- --passWithNoTests --watchAll=false
        when: [script:test, "runner:jest"]
        counts_tests: node
